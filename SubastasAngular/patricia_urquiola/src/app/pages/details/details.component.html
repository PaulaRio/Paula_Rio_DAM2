<article>
    <img
      class="listing-photo"
      [src]="product?.photo"
      alt="Exterior photo of {{ product?.name }}"
      crossorigin
    />
    <section class="listing-description">
      <h2 class="listing-heading">{{ product?.name }}</h2>
      >--
      <!--<p class="listing-location">{{ product?.city }}, {{ product?.state }}</p>-->
    </section>
    <section class="listing-features">
      <h2 class="section-heading">About this housing location</h2>
      <ul>
        <!--<li>Units available: {{ product?.availableUnits }}</li>-->
        <!--<li>Does this location have wifi: {{ product?.wifi }}</li>-->
        <!--<li>Does this location have laundry: {{ product?.laundry }}</li>-->
      </ul>
    </section>
    <section class="listing-apply">
      <h2 class="section-heading">Introduce el valor de tu puja</h2>
      <form [formGroup]="applyForm" (submit)="submitApplication()">
        <label for="valor">Valor</label>
        <input id="valor" type="number" formControlName="valor" />
        <button type="submit" class="primary">Apply now</button>
      </form>
    </section>
  </article>
